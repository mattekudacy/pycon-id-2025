[project]
name = "pycon-id-2025"
version = "1.0.0"
description = "PyCon ID 2025 - Building Modern Terminal UIs with Textual"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.47.0",
    "httpx>=0.25.0",
    "rich>=13.0.0",
    "ollama>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm", "ui"]
